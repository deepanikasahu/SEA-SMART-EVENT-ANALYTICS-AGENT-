# ─── v2 Runtime Configuration ─────────────────────────────────────────────────

database:
  # Isolated copy — never points at v1's data/sea_agent.db
  path: "event-analytics-v2/data/sea_agent_v2.db"

llm:
  # Default provider for v2 (Claude). Override via V2_LLM_PROVIDER env var.
  provider: "groq"         # Options: "claude", "groq", "mock"
  claude:
    model: "claude-3-5-sonnet-20241022"
    max_tokens: 2048
  groq:
    model: "llama-3.3-70b-versatile"
    max_tokens: 2048
  mock:
    response_latency_ms: 50

pipeline:
  max_clarification_retries: 2
  missing_data_policy: "exclude_and_disclose"  # never silent imputation
  # Minimum fraction of events with data to include a club in rankings
  min_completeness_threshold: 0.0              # include all clubs, flag incomplete ones

reporting:
  output_dir: "event-analytics-v2/reports"
  charts:
    bar_chart_height: 500
    radar_chart_height: 500

api:
  host: "0.0.0.0"
  port: 8001
  title: "Smart Event Analytics Agent v2"
